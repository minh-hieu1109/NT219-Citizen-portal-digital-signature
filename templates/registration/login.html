{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <p class="muted">Use demo users from <code>python manage.py create_demo_users</code>.</p>
    <p class="muted">Need a citizen account? <a href="{% url 'register' %}">Register here</a>.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Login</button>
    </form>
</div>
{% endblock %}
